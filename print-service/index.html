<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zebra QR Print Test</title>


  <style>
    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 30px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f3f4f6;
    }


    .container {

      max-width: 520px;

      margin: auto;

      background: white;

      padding: 25px;

      border-radius: 14px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.12);
    }


    h1 {

      margin-top: 0;

      text-align: center;

      font-size: 24px;
    }


    .field {

      margin-top: 18px;
    }


    label {

      display: block;

      font-weight: bold;

      margin-bottom: 6px;
    }


    input {

      width: 100%;

      padding: 11px;

      border: 1px solid #ccc;

      border-radius: 7px;

      font-size: 15px;
    }


    button {

      width: 100%;

      margin-top: 22px;

      padding: 13px;

      border: none;

      border-radius: 8px;

      background: #111827;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }


    button:hover {

      background: #1f2937;
    }


    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;
    }


    .preview-title {

      margin-top: 25px;

      font-weight: bold;

      text-align: center;
    }


    /*
         * Browser preview
         *
         * 50 × 40 mm at 203 DPI
         * ≈ 400 × 320 dots
         */

    .label-preview {

      width: 400px;

      height: 320px;

      max-width: 100%;

      margin: 12px auto 0;

      border: 1px dashed #999;

      display: flex;

      flex-direction: column;

      align-items: center;

      background: white;

      padding-top: 30px;
    }


    /*
         * QR preview
         */

    #qrcode {

      width: 200px;

      height: 200px;

      display: flex;

      justify-content: center;

      align-items: center;
    }


    #qrcode img {

      width: 200px;

      height: 200px;
    }


    /*
         * Filename preview
         */

    #fileNamePreview {

      margin-top: 5px;

      font-size: 20px;

      font-weight: bold;

      text-align: center;

      max-width: 360px;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;
    }


    /*
         * Status
         */

    #status {

      margin-top: 18px;

      padding: 12px;

      background: #f8fafc;

      border-radius: 8px;

      white-space: pre-wrap;

      font-size: 14px;
    }
  </style>

</head>


<body>


  <div class="container">


    <h1>
      🖨️ Zebra QR Print Test
    </h1>


    <!-- =====================================================
         QR DATA
         ===================================================== -->

    <div class="field">

      <label>
        QR Data
      </label>

      <input id="qrData" type="text" value="Narendra Sirisipalli" placeholder="Enter information for QR">

    </div>


    <!-- =====================================================
         FILE NAME
         ===================================================== -->

    <div class="field">

      <label>
        File Name
      </label>

      <input id="fileName" type="text" value="Narendra Sirisipalli" placeholder="Enter file name">

    </div>


    <!-- =====================================================
         PREVIEW TITLE
         ===================================================== -->

    <div class="preview-title">

      Label Preview

    </div>


    <!-- =====================================================
         LABEL PREVIEW
         ===================================================== -->

    <div class="label-preview">


      <div id="qrcode"></div>


      <div id="fileNamePreview">
        Narendra Sirisipalli
      </div>


    </div>


    <!-- =====================================================
         PRINT BUTTON
         ===================================================== -->

    <button id="printButton">

      Print QR + File Name

    </button>


    <!-- =====================================================
         STATUS
         ===================================================== -->

    <div id="status">

      Ready to print.

    </div>


  </div>


  <!-- =========================================================
     QR CODE LIBRARY
     ========================================================= -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
  </script>


  <script>


    // ========================================================
    // ELEMENTS
    // ========================================================

    const qrDataInput =
      document.getElementById(
        "qrData"
      );


    const fileNameInput =
      document.getElementById(
        "fileName"
      );


    const qrContainer =
      document.getElementById(
        "qrcode"
      );


    const fileNamePreview =
      document.getElementById(
        "fileNamePreview"
      );


    const printButton =
      document.getElementById(
        "printButton"
      );


    const status =
      document.getElementById(
        "status"
      );


    // ========================================================
    // GENERATE QR
    // ========================================================

    function generateQR() {

      const qrData =
        qrDataInput.value.trim();


      const fileName =
        fileNameInput.value.trim();


      // Clear previous QR

      qrContainer.innerHTML = "";


      // Update filename

      fileNamePreview.textContent =
        fileName ||
        "File Name";


      // Don't generate empty QR

      if (!qrData) {

        return;
      }


      // Generate QR

      new QRCode(

        qrContainer,

        {

          text: qrData,

          width: 200,

          height: 200,

          correctLevel:
            QRCode.CorrectLevel.M

        }

      );

    }


    // ========================================================
    // LIVE QR UPDATE
    // ========================================================

    qrDataInput.addEventListener(
      "input",
      generateQR
    );


    fileNameInput.addEventListener(
      "input",
      generateQR
    );


    // ========================================================
    // PRINT
    // ========================================================

    printButton.addEventListener(

      "click",

      async function () {


        const qrData =
          qrDataInput.value.trim();


        const fileName =
          fileNameInput.value.trim();


        // ------------------------------------------------
        // VALIDATION
        // ------------------------------------------------

        if (!qrData) {

          status.textContent =
            "❌ QR Data is empty.";

          return;
        }


        if (!fileName) {

          status.textContent =
            "❌ File Name is empty.";

          return;
        }


        // ------------------------------------------------
        // DISABLE BUTTON
        // ------------------------------------------------

        printButton.disabled = true;


        status.textContent =
          "Sending print job to Zebra printer...";


        try {


          // --------------------------------------------
          // SEND TO PYTHON SERVER
          // --------------------------------------------

          const response =
            await fetch(

              "/print",

              {

                method: "POST",

                headers: {

                  "Content-Type":
                    "application/json"

                },

                body:
                  JSON.stringify({

                    qrData:
                      qrData,

                    fileName:
                      fileName

                  })

              }

            );


          // --------------------------------------------
          // READ RESPONSE
          // --------------------------------------------

          const result =
            await response.json();


          // --------------------------------------------
          // SUCCESS
          // --------------------------------------------

          if (result.ok) {

            status.textContent =

              "✅ Print job sent successfully.\n\n" +

              "Printer: " +
              result.printer +
              "\n\n" +

              "Request: " +
              result.request;

          }


          // --------------------------------------------
          // ERROR
          // --------------------------------------------

          else {

            status.textContent =

              "❌ Print failed.\n\n" +

              result.error;

          }


        }


        catch (error) {


          status.textContent =

            "❌ Could not connect to " +
            "the local print server.\n\n" +

            error;


        }


        finally {

          printButton.disabled = false;

        }

      }

    );


    // ========================================================
    // INITIAL PREVIEW
    // ========================================================

    generateQR();


  </script>


</body>

</html>
